<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f9" />
    <meta name="description" content="Jogue mini-games e ganhe prêmios de verdade nos restaurantes parceiros de Natal." />

    <!-- Fotos das casas vêm do Unsplash: abre a conexão antes do primeiro img -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />

    <!-- iOS: instalar pela tela de início e abrir em tela cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BetFood" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <!-- Prévia do link (WhatsApp, iMessage, redes): URL absoluta é obrigatória
         pros robôs de preview; o og.png é gerado a partir de scripts/og-card.html -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BetFood" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://betfood.vercel.app/" />
    <meta property="og:title" content="BetFood — jogue enquanto espera, ganhe no restaurante" />
    <meta
      property="og:description"
      content="Roleta, raspadinha, quiz e memória nas casas parceiras de Natal. Ganhou, o cupom cai na hora. Sem custo, sem aposta."
    />
    <meta property="og:image" content="https://betfood.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roleta do BetFood com o nome do app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BetFood — jogue enquanto espera, ganhe no restaurante" />
    <meta
      name="twitter:description"
      content="Roleta, raspadinha, quiz e memória nas casas parceiras de Natal. Ganhou, o cupom cai na hora."
    />
    <meta name="twitter:image" content="https://betfood.vercel.app/og.png" />

    <title>BetFood — Jogue e ganhe no seu restaurante</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
